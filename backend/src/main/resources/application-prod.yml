# prod环境：TiDB Cloud Starter（MySQL协议）。连接串全部走环境变量（Render注入），绝不入库
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.miniboos: info
